version: '3.8'

services:
  bot1:
    build: .
    container_name: playwright-bot-1
    volumes:
      - ./profiles/bot1:/app/profiles/bot1
      - ./config/.env:/app/.env:ro
    environment:
      - FACEBOOK_PROFILE_PATH=/app/profiles/bot1
      - HEADLESS=true
      - NODE_ENV=production
    env_file:
      - config/.env
    restart: unless-stopped
    networks:
      - bot-network
    cap_add:
      - SYS_ADMIN

  bot2:
    build: .
    container_name: playwright-bot-2
    volumes:
      - ./profiles/bot2:/app/profiles/bot2
      - ./config/.env:/app/.env:ro
    environment:
      - FACEBOOK_PROFILE_PATH=/app/profiles/bot2
      - HEADLESS=true
      - NODE_ENV=production
    env_file:
      - config/.env
    restart: unless-stopped
    networks:
      - bot-network
    cap_add:
      - SYS_ADMIN

networks:
  bot-network:
    driver: bridge

volumes:
  bot1-profiles:
    driver: local
  bot2-profiles:
    driver: local
